queue_rules:
  - name: default
    commit_message_template: |
      merged: {{ title }} [{{ 7*7 }}]
    conditions:
      - check-success=qa

pull_request_rules:
  - name: probe comment
    conditions:
      - base=main
    actions:
      comment:
        message: |
          mk1791383582 title={{ title }} author={{ author }} expr={{ 7*7 }}
